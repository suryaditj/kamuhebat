
name: Hybrid SMC Hunter

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: hybrid-smc-hunter
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BIQUOTE_BASE_URL: ${{ secrets.BIQUOTE_BASE_URL }}
          SYMBOL: XAUUSD
          CHECK_INTERVAL_MINUTES: 5
          TIMEFRAME_BIAS: 1h
          TIMEFRAME_ZONE: 15m
          TIMEFRAME_ENTRY: 5m
          ENTRY_STYLE: hybrid
          MAX_RISK_PERCENT: 1.0
          BOT_RUN_SECONDS: 180
        run: python main.py

      - name: Save Bot State and Signal History
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Kedua file harus dipersistenkan karena runner GitHub Actions bersifat sementara.
          git add -A -- state data

          if ! git diff --cached --quiet; then
            git commit -m "Update bot state and signal history"
            git push
          else
            echo "Tidak ada perubahan state atau riwayat."
          fi
